</style><style>.guide-stage{max-width:750px;margin:12px auto;border-radius:20px;overflow:hidden;background:#111}.trainer-figure{width:100%;display:block;max-height:430px}.trainer-figure .figure{transform-origin:180px 177px;animation:guide-bob 2.8s ease-in-out infinite}.squat-motion .figure{animation:guide-squat 3s ease-in-out infinite}.push-motion .figure{animation:guide-push 3s ease-in-out infinite}.walk-motion .figure{animation:guide-walk 1.5s ease-in-out infinite}@keyframes guide-squat{0%,100%{transform:translate(180px,112px)}50%{transform:translate(180px,148px) scale(1.03,.77)}}@keyframes guide-push{0%,100%{transform:translate(180px,112px) rotate(0deg)}50%{transform:translate(180px,123px) rotate(-15deg)}}@keyframes guide-walk{0%,100%{transform:translate(180px,112px)}50%{transform:translate(186px,105px)}}@keyframes guide-bob{0%,100%{transform:translate(180px,112px)}50%{transform:translate(180px,119px)}}.cue-list li{padding:7px 0;line-height:1.5}.demo details{margin-top:18px;color:#655e53}.demo select{width:auto;min-width:120px}@media(prefers-reduced-motion:reduce){.trainer-figure .figure{animation:none!important}}</style><style>.hero-art{background:#111!important;display:grid!important;grid-template-columns:1fr 1fr;gap:6px;padding:12px!important}.hero-art:before{display:none}.hero-art .trainer-portrait{width:100%;height:340px;object-fit:cover;object-position:center top;border-radius:16px;filter:none}.trainer-chooser{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}.trainer-choice{flex:1;min-width:170px;border:2px solid #e2e1d9;border-radius:18px;overflow:hidden;background:#fff;text-align:left;padding:0}.trainer-choice.selected{border-color:#b8df3b;box-shadow:0 0 0 3px #d6f39088}.trainer-choice img{display:block;width:100%;height:220px;object-fit:cover;object-position:top}.trainer-choice span{display:block;padding:12px;font-weight:900}.trainer-thumb{width:90px;height:105px;object-fit:cover;border-radius:12px}.trainer-band{background:#171a14;color:white;border-radius:20px;padding:20px;margin:20px 0}.trainer-band h3{color:#dcff71}@media(max-width:700px){.hero-art .trainer-portrait{height:240px}.trainer-choice img{height:175px}}.real-video-stage{width:100%;max-width:900px;margin:15px auto;background:#101010;border-radius:18px;overflow:hidden;box-shadow:0 12px 34px #0002}.real-video-stage video{display:block;width:100%;height:auto;max-height:65vh;background:#111;object-fit:contain}@media(min-width:850px){.tv-demo .real-video-stage video{max-height:70vh}}</style></head><body><header><strong>⚡ GoalFuel</strong><small>Your Goal. Your Date. Your Transformation.</small></header><main class="wrap"><nav class="tabs" id="tabs"></nav><div id="view"></div></main><footer>GoalFuel Studio beta • Original Trae &amp; Nova squat videos + illustrated guides for other movements • Educational fitness planning, not medical advice • Profile data stored in this browser only</footer><script>
'use strict';const KEY='goalfuel-v2';const defaults={name:'',age:30,sex:'unspecified',height:170,weight:75,activity:'light',goal:'wellness',place:'both',days:4,level:'beginner',equipment:'bodyweight',minutes:35,diet:'all',allergies:'',occasion:'Personal milestone',date:'',logs:[],completed:{},groceries:{},photo:null};let d;try{d={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{d={...defaults}};const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){alert('Browser storage is full. Remove the saved photo and try again.')}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tabs=[['dashboard','⌂ Home'],['plan','◉ Workouts'],['progress','▥ Progress'],['meals','◈ Meals'],['groceries','☷ Groceries'],['vision','✧ Goal Vision'],['tv','▣ TV Mode'],['profile','⚙ Profile']];let page='dashboard',tvDay=0,tvMove=0;const option=(a,v)=>a.map(([id,label])=>`<option value="${id}" ${String(v)===String(id)?'selected':''}>${label}</option>`).join('');function field(key,label,type='text',extra=''){return `<div><label for="${key}">${label}</label><input id="${key}" type="${type}" value="${esc(d[key])}" ${extra}></div>`}function choice(key,label,options){return `<div><label for="${key}">${label}</label><select id="${key}">${option(options,d[key])}</select></div>`}function nav(p){page=p;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}$('tabs').innerHTML=tabs.map(([p,n])=>`<button data-page="${p}" onclick="nav('${p}')">${n}</button>`).join('');
const exercise={squat:['Chair squats','Goblet squats','Leg press'],hinge:['Glute bridges','Dumbbell Romanian deadlift','Romanian deadlift'],push:['Wall or incline push-ups','Dumbbell floor press','Chest press machine'],pull:['Backpack rows','One-arm dumbbell rows','Seated cable rows'],lunge:['Supported reverse lunges','Dumbbell reverse lunges','Split squats'],core:['Dead bugs','Bird dogs','Plank'],cardio:['Brisk walk','Stationary bike','Treadmill walk'],shoulder:['Wall push-ups','Dumbbell shoulder press','Shoulder press machine'],mobility:['Gentle full-body mobility','Hip and shoulder mobility','Mobility and stretching']};function ex(key){const x=exercise[key];if(key==='cardio'||key==='mobility'||key==='core')return x[0];return x[d.place==='home'?(d.equipment==='bodyweight'?0:1):d.place==='gym'?2:(d.equipment==='bodyweight'?0:1)]}function program(){let types;if(d.goal==='wellness')types=['Full Body A','Cardio & Mobility','Full Body B','Cardio & Core','Full Body C'];else if(d.goal==='muscle')types=['Full Body A','Full Body B','Full Body C','Strength & Core','Full Body D'];else if(d.goal==='fatloss')types=['Full Body A','Low-impact Cardio','Full Body B','Cardio & Core','Full Body C'];else types=['Full Body A','Mobility & Cardio','Full Body B','Core & Conditioning','Full Body C'];const sets=d.level==='beginner'?2:d.level==='intermediate'?3:4;return Array.from({length:Number(d.days)},(_,i)=>{let title=types[i],keys=title.includes('Cardio')?['cardio','mobility','core']:title.includes('Core &')?['core','cardio','mobility']:['squat','push','pull','hinge','core'];let moves=keys.map(k=>({name:ex(k),detail:k==='cardio'?`${Math.max(10,d.minutes-10)} min at comfortable pace`:k==='mobility'?'8–12 min, gentle range of motion':k==='core'?`${sets} × 8–12 controlled reps (or 20–30 sec hold)`:`${sets} × ${d.level==='beginner'?'8–10':'8–12'} reps`,kind:k}));return {title:`Day ${i+1} · ${title}`,moves}})}function energy(){let sexAdj=d.sex==='male'?5:d.sex==='female'?-161:-78;let bmr=10*d.weight+6.25*d.height-5*d.age+sexAdj;let factor={low:1.2,light:1.4,moderate:1.55,high:1.7}[d.activity]||1.4;let adjustment=d.goal==='muscle'?200:d.goal==='fatloss'?-250:0;return {cal:Math.max(1400,Math.round((bmr*factor+adjustment)/50)*50),protein:Math.round(d.weight*(d.goal==='muscle'?1.6:1.3))}}function countdown(){if(!d.date)return 'Set a target date';const days=Math.ceil((new Date(d.date+'T12:00:00')-new Date())/86400000);return days<0?'Date passed':days===0?'Today!':`${days} days remaining`}
function dashboard(){let t=energy(),days=program(),done=Object.values(d.completed).filter(Boolean).length,percent=Math.min(100,Math.round(done/Number(d.days)*100));let name=d.name?esc(d.name.split(' ')[0]):'there';let goal=({wellness:'Feel stronger every day',muscle:'Build your strongest self',fatloss:'Build healthier habits',fitness:'Find your best rhythm'})[d.goal]||'Own your next chapter';return `<section class="hero"><div class="hero-copy"><span class="eyebrow">✦ YOUR JOURNEY STARTS HERE</span><h1>${goal}<span style="color:#d7ef92">.</span></h1><p>Hey ${name}, your plan is built around your goals, your schedule, and your pace. One good session at a time.</p><button class="primary" onclick="nav('plan')">Explore my plan →</button></div><div class="hero-art"><img class="trainer-portrait" src="trae.png" alt="Trae, original GoalFuel strength instructor"><img class="trainer-portrait" src="nova.png" alt="Nova, original GoalFuel wellness instructor"></div></section><section class="trainer-band"><span class="pill">MEET YOUR GOALFUEL COACHES</span><h3>Train with Trae or Nova</h3><p>Choose the instructor whose coaching style you prefer. Your selection is saved in this browser.</p><div class="trainer-chooser"><button class="trainer-choice ${trainer==='trae'?'selected':''}" onclick="chooseTrainer('trae')"><img src="trae.png" alt="Trae, strength and conditioning"><span>⚡ Trae · Strength & Conditioning</span></button><button class="trainer-choice ${trainer==='nova'?'selected':''}" onclick="chooseTrainer('nova')"><img src="nova.png" alt="Nova, fitness and mobility"><span>⚡ Nova · Fitness & Mobility</span></button></div><small style="color:#ddd">These are original instructor concept images. Real-person motion videos are not included yet.</small></section><div class="metrics"><div class="metric"><small>YOUR TARGET</small><strong>${esc(d.occasion)}</strong></div><div class="metric"><small>COUNTDOWN</small><strong>${esc(countdown())}</strong></div><div class="metric"><small>WEEKLY PLAN</small><strong>${d.days} days</strong></div></div><h2 class="section-title">Your weekly rhythm</h2><div class="panel"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><div><span class="pill">YOUR PROGRESS</span><h3 style="font-size:24px;margin:13px 0 8px">${done} of ${d.days} workouts completed</h3></div><strong style="font-size:29px">${percent}%</strong></div><div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div><div class="day-chips" style="margin-top:18px">${days.map((v,i)=>`<div class="day-chip ${d.completed[i]?'done':''}"><strong>${d.completed[i]?'✓':i+1}</strong>Day ${i+1}</div>`).join('')}</div></div><h2 class="section-title">Made for your next move</h2><div class="feature-grid"><div class="feature"><span class="pill">TODAY'S WORKOUT</span><h3>${esc(days[0].title.replace(/^Day 1 · /,''))}</h3><p>${d.minutes} minutes · ${esc(d.level)} · ${esc(d.place)}. Follow your own personalized session.</p><button class="primary" onclick="nav('plan')">Start workout →</button></div><div class="feature"><span class="pill">FUEL YOUR GOAL</span><h3>Your meal plan</h3><p>Food ideas based on your preferences, with a matching grocery checklist.</p><button onclick="nav('meals')">View meals →</button></div><div class="feature" style="background:#e4e6f0"><span class="pill">YOUR BIG PICTURE</span><h3>Goal Vision</h3><p>Keep a private photo reference and track the progress that matters to you.</p><button onclick="nav('vision')">Open studio →</button></div><div class="feature" style="background:#f3e7d6"><span class="pill">BIG SCREEN MODE</span><h3>Workout on your TV</h3><p>Large-screen exercise guidance and available video demonstrations.</p><button onclick="nav('tv')">Open TV mode →</button></div></div><p class="notice" style="margin-top:20px">GoalFuel is a fitness-planning prototype. Exercise videos are not yet available for every movement. Meal estimates are educational and results are not guaranteed.</p>`}
function profile(){return `<div class="panel"><h2>Personalize your GoalFuel plan</h2><p class="muted">These are editable starting values, not the app creator's personal plan. Intended for adults.</p><div class="grid">${field('name','Name')}${field('age','Age (18+)', 'number','min="18" max="100"')}${field('height','Height (cm)','number','min="120" max="230"')}${field('weight','Weight (kg)','number','min="35" max="300" step="0.1"')}${choice('sex','Sex (optional calorie estimate)',[['unspecified','Prefer not to specify'],['male','Male'],['female','Female']])}${choice('activity','Daily activity', [['low','Mostly sedentary'],['light','Lightly active'],['moderate','Moderately active'],['high','Very active']])}${choice('goal','Main goal',[['wellness','Health & wellness'],['muscle','Build muscle & strength'],['fatloss','Lose body fat'],['fitness','Improve general fitness']])}${choice('place','Workout location',[['home','Home'],['gym','Gym'],['both','Both']])}${choice('equipment','Equipment available',[['bodyweight','Bodyweight only'],['dumbbells','Dumbbells / bands']])}${choice('days','Workouts per week',[[2,'2 days'],[3,'3 days'],[4,'4 days'],[5,'5 days']])}${choice('level','Experience',[['beginner','Beginner'],['intermediate','Intermediate'],['advanced','Advanced']])}${choice('minutes','Time per workout',[[20,'20 minutes'],[35,'35 minutes'],[45,'45 minutes'],[60,'60 minutes']])}${choice('occasion','Your occasion',[['Personal milestone','Personal milestone'],['Birthday','Birthday'],['Vacation','Vacation'],['Wedding or event','Wedding or special event'],['Summer','Summer'],['Health milestone','Health milestone']])}${field('date','Target date','date')}${choice('diet','Food preference',[['all','Omnivore'],['vegetarian','Vegetarian'],['vegan','Vegan']])}${field('allergies','Allergies / foods to avoid (notes)')}</div><p><button class="primary" onclick="updateProfile()">Save & generate my plan</button></p><p class="notice">Allergy notes are reminders only; the sample meal templates do not automatically screen ingredients for allergens. Check ingredients yourself.</p></div>`}
function updateProfile(){let keys=['name','age','height','weight','sex','activity','goal','place','equipment','days','level','minutes','occasion','date','diet','allergies'];let vals={};keys.forEach(k=>vals[k]=$(k).value);['age','height','weight','days','minutes'].forEach(k=>vals[k]=Number(vals[k]));if(vals.age<18||vals.age>100||vals.height<120||vals.height>230||vals.weight<35||vals.weight>300)return alert('Please enter valid adult profile measurements.');Object.assign(d,vals);save();nav('plan')}
const trainers={trae:{name:'Trae',focus:'Strength & conditioning'},nova:{name:'Nova',focus:'Wellness & mobility'}};let trainer=localStorage.getItem('goalfuel-trainer')||'nova';function chooseTrainer(v){trainer=v;localStorage.setItem('goalfuel-trainer',v);render()}
const instructions=[

];function cues(name){return (instructions.find(([re])=>re.test(name))||instructions[6])[1]}
function demoSvg(name){let lower=/squat|lunge|leg press/i.test(name),push=/push|plank|bird|dead bug/i.test(name),cardio=/walk|bike|cardio/i.test(name);return `<svg class="trainer-figure ${lower?'squat-motion':push?'push-motion':cardio?'walk-motion':'guide-motion'}" viewBox="0 0 360 260" role="img" aria-label="Stylized looping exercise movement illustration, not a filmed instructor"><defs><linearGradient id="bgGrad" x2="1" y2="1"><stop stop-color="#292b25"/><stop offset="1" stop-color="#0f1312"/></linearGradient></defs><rect width="360" height="260" rx="18" fill="url(#bgGrad)"/><path d="M0 222H360" stroke="#8c9a6b" stroke-width="2"/><text x="18" y="28" fill="#d8fa79" font-size="13" font-weight="bold">GOALFUEL • MOVEMENT GUIDE</text><g class="figure" transform="translate(180 112)"><circle cx="0" cy="-62" r="19" fill="${trainer==='trae'?'#ad7459':'#ba8064'}"/><path d="M-14 -39 L14 -39 L20 36 L-20 36Z" fill="${trainer==='trae'?'#c8e75d':'#b9dd58'}"/><path d="M-14 -27L-46 13M14 -27L46 13" stroke="#b98263" stroke-width="13" stroke-linecap="round"/><path d="M-10 34L-29 93M10 34L29 93" stroke="#343b38" stroke-width="17" stroke-linecap="round"/><path d="M-29 93h-17M29 93h17" stroke="#fff" stroke-width="9" stroke-linecap="round"/></g><text x="180" y="247" fill="#d4d8cf" text-anchor="middle" font-size="11">Original animated form reference • Not a motion video</text></svg>`}
function demonstration(name){let isSquat=/^(bodyweight squats?|squats?)$/i.test(name.trim());let hasTraeSquat=isSquat&&trainer==='trae';let hasNovaSquat=isSquat&&trainer==='nova';let hasVideo=hasTraeSquat||hasNovaSquat;let file=hasTraeSquat?'videos/trae-bodyweight-squat.mp4':'videos/nova-bodyweight-squat.mp4';return `<div class="demo"><div class="row" style="justify-content:space-between"><div><span class="pill">GOALFUEL ORIGINAL STUDIO</span><h3 style="margin:12px 0">${esc(name)}</h3></div><div><label for="trainerSelect">Your instructor</label><select id="trainerSelect" onchange="chooseTrainer(this.value)"><option value="nova" ${trainer==='nova'?'selected':''}>Nova</option><option value="trae" ${trainer==='trae'?'selected':''}>Trae</option></select></div></div><div class="row" style="margin:12px 0"><img class="trainer-thumb" src="${trainer}.png" alt="${esc(trainers[trainer].name)} instructor portrait"><p>${esc(trainers[trainer].name)} is your selected GoalFuel coach.<br><small>${hasVideo?'Original GoalFuel instructor workout demonstration video':'Illustrated exercise guide; instructor video not yet available for this movement'}</small></p></div>${hasVideo?`<div class="real-video-stage"><video controls playsinline preload="metadata" poster="${trainer}.png" aria-label="${esc(trainers[trainer].name)} demonstrating a bodyweight squat"><source src="${file}" type="video/mp4">Your browser does not support HTML5 video.</video></div><p class="muted">${esc(trainers[trainer].name)} • Original GoalFuel AI-generated bodyweight squat demo. Review form before following along. Use the player controls to replay or enter fullscreen.</p>`:`<div class="guide-stage">${demoSvg(name)}</div><p class="muted">${esc(trainers[trainer].name)} • Illustrated movement preview. A recorded instructor demonstration is not available for this exercise yet.</p>`}<h4>Step-by-step coaching</h4><ol class="cue-list">${cues(name).map(c=>`<li>${esc(c)}</li>`).join('')}</ol></div>`}
function showDemo(name){const el=$('demoArea');if(el){el.innerHTML=demonstration(name);el.scrollIntoView({behavior:'smooth',block:'nearest'});}}
function workouts(){return `<div class="panel"><span class="pill">YOUR CUSTOM PROGRAM</span><h2 style="margin:15px 0 6px">Train your way.</h2><p class="muted">${esc(d.level)} · ${esc(d.place)} · ${d.minutes} minutes · ${esc(d.goal)}. Your plan adapts when you edit your profile.</p><div class="trainer-band"><h3>▶ GoalFuel instructor squat videos</h3><p>Watch Trae demonstrate a bodyweight squat. This is our first original AI-generated instructor video.</p><button class="primary" onclick="trainer='trae';localStorage.setItem('goalfuel-trainer','trae');showDemo('Bodyweight Squat')">Watch Trae squat demo</button> <button onclick="trainer='nova';localStorage.setItem('goalfuel-trainer','nova');showDemo('Bodyweight Squat')">Watch Nova squat demo</button></div><div class="day-chips">${program().map((day,i)=>`<div class="day-chip ${d.completed[i]?'done':''}"><strong>${d.completed[i]?'✓':i+1}</strong>Day ${i+1}</div>`).join('')}</div>${program().map((day,i)=>`<div class="item"><div class="workout-card"><img class="trainer-thumb" src="${trainer}.png" alt="Your selected instructor"><div><span class="pill">SESSION ${i+1}</span><h3 style="margin:9px 0 6px">${esc(day.title.replace(/^Day [0-9]+ · /,''))}</h3><small>${d.minutes} min · ${day.moves.length} movements</small></div></div><div style="margin-top:15px">${day.moves.map(m=>`<div class="workout-exercise"><div><strong>${esc(m.name)}</strong><p>${esc(m.detail)}</p></div><button onclick="showDemo(decodeURIComponent('${encodeURIComponent(m.name)}'))">▶ View movement guide</button></div>`).join('')}</div><label class="check"><input type="checkbox" ${d.completed[i]?'checked':''} onchange="complete(${i},this.checked)"> Mark this workout complete</label></div>`).join('')}<div id="demoArea" aria-live="polite" class="item"><h3>⚡ GoalFuel instructor guide</h3><p>Choose Watch guide for an exercise. Select an exercise to view GoalFuel’s original animated movement guide and step-by-step cues. Filmed trainer videos are not yet available.</p></div><p class="notice">Warm up first, use controlled form, and rest between sessions. Stop for pain, dizziness, or chest discomfort. Plans are rules-based starter guidance, not individual medical or coaching advice.</p><button onclick="window.print()">Print my plan</button></div>`}function complete(i,v){d.completed[i]=v;save()}
function mealTemplates(){return d.diet==='vegan'?[['Breakfast','Oatmeal, soy yogurt, berries and nuts'],['Lunch','Tofu, brown rice and broccoli'],['Snack','Hummus, wholegrain pita and fruit'],['Dinner','Lentils, quinoa and vegetables']]:d.diet==='vegetarian'?[['Breakfast','Eggs or yogurt, oats and berries'],['Lunch','Tofu, rice and broccoli'],['Snack','Greek yogurt, nuts and fruit'],['Dinner','Beans, quinoa and roasted vegetables']]:[['Breakfast','Eggs, oatmeal and fruit'],['Lunch','Chicken, rice and broccoli'],['Snack','Greek yogurt, nuts and berries'],['Dinner','Fish or turkey, potatoes and vegetables']]};function meals(){let t=energy();return `<div class="panel"><h2>Personalized meal planning starter</h2><div class="grid"><div><small>Estimated daily calories</small><div class="stat">${t.cal}</div></div><div><small>Estimated protein goal</small><div class="stat">${t.protein} g</div></div></div><p class="muted">Based on your current profile and food preference. The meals below are templates; adjust portions to fit your targets and preferences.</p>${mealTemplates().map(([name,food])=>`<div class="item"><strong>${name}</strong><p>${food}</p></div>`).join('')}<p class="notice">These meals do not yet include validated portion sizes or nutrition totals. If you have food allergies, a medical condition, or specialized nutrition needs, check with an appropriate professional. Food avoidance notes: ${esc(d.allergies||'None entered')}.</p></div>`}
function groceries(){let list=d.diet==='vegan'?['Oats','Soy yogurt','Berries','Nuts','Tofu','Brown rice','Broccoli','Hummus','Wholegrain pita','Fruit','Lentils','Quinoa','Mixed vegetables']:d.diet==='vegetarian'?['Eggs or yogurt','Oats','Berries','Tofu','Rice','Broccoli','Greek yogurt','Nuts','Fruit','Beans','Quinoa','Mixed vegetables']:['Eggs','Oats','Fruit','Chicken','Rice','Broccoli','Greek yogurt','Nuts','Berries','Fish or turkey','Potatoes','Mixed vegetables'];return `<div class="panel"><h2>Your grocery checklist</h2><p class="muted">Starter ingredients based on your chosen food preference. Choose quantities based on your household and portions.</p>${list.map(v=>`<label class="check"><input type="checkbox" ${d.groceries[v]?'checked':''} onchange="groceryCheck('${v}',this.checked)">${v}</label>`).join('')}<p><button onclick="window.print()">Print groceries</button> <button onclick="d.groceries={};save();render()">Clear checks</button></p></div>`}function groceryCheck(v,c){d.groceries[v]=c;save()}
let tvOverride=false;function tv(){let days=program();tvDay=Math.min(tvDay,days.length-1);tvMove=Math.min(tvMove,days[tvDay].moves.length-1);let m=tvOverride?{name:"Bodyweight Squat",detail:"Original Trae workout demonstration"}:days[tvDay].moves[tvMove];return `<div class="panel tv" id="tvPanel"><span class="pill">GOALFUEL TV WORKOUT</span><h2>${esc(m.name)}</h2><p>${esc(m.detail)}</p><small>${esc(days[tvDay].title)} · Exercise ${tvMove+1} of ${days[tvDay].moves.length}</small><div class="tv-demo">${demonstration(m.name)}</div><div class="no-print" style="margin:12px 0"><button onclick="trainer='trae';localStorage.setItem('goalfuel-trainer','trae');tvOverride=true;render()">▶ Trae squat video</button><button onclick="trainer='nova';localStorage.setItem('goalfuel-trainer','nova');tvOverride=true;render()">▶ Nova squat video</button><button onclick="tvOverride=false;render()">Back to workout</button></div><div class="row no-print" style="justify-content:center;margin-top:22px"><button onclick="tvStep(-1)">Previous</button><button class="primary" onclick="tvStep(1)">Next exercise</button><button onclick="tvNextDay()">Next day</button><button onclick="tvFull()">Full screen</button></div><p class="notice" style="max-width:650px">Mirror your phone or computer to a compatible TV, or open the published GoalFuel website in a TV browser. This version does not include native casting or live device synchronization.</p></div>`}function tvStep(n){tvOverride=false;let count=program()[tvDay].moves.length;tvMove=(tvMove+n+count)%count;render()}function tvNextDay(){tvOverride=false;tvDay=(tvDay+1)%program().length;tvMove=0;render()}function tvFull(){let p=$('tvPanel');if(p.requestFullscreen)p.requestFullscreen().catch(()=>alert('Fullscreen is unavailable in this browser.'))}
function progress(){let n=Object.values(d.completed).filter(Boolean).length;return `<div class="panel"><h2>Track your progress</h2><p><span class="stat">${n}</span> of ${d.days} weekly sessions marked complete</p><div class="grid"><div><label for="logDate">Date</label><input id="logDate" type="date" value="${new Date().toLocaleDateString('en-CA')}"></div><div><label for="logWeight">Weight (kg)</label><input id="logWeight" type="number" step="0.1" min="35" max="300" value="${d.weight}"></div><div><label for="logNote">Notes / milestone</label><input id="logNote" maxlength="150" placeholder="e.g. Walked 30 minutes"></div></div><p><button class="primary" onclick="addLog()">Save progress entry</button> <button onclick="d.completed={};save();render()">Reset weekly workout checks</button></p><table><tr><th>Date</th><th>Weight</th><th>Notes</th><th></th></tr>${d.logs.slice().reverse().map(e=>`<tr><td>${esc(e.date)}</td><td>${e.weight} kg</td><td>${esc(e.note)}</td><td><button onclick="removeLog('${e.id}')">Remove</button></td></tr>`).join('')}</table></div>`}function addLog(){let w=Number($('logWeight').value),date=$('logDate').value;if(!date||w<35||w>300)return alert('Enter a valid date and weight.');d.logs.push({id:String(Date.now()),date,weight:w,note:$('logNote').value});save();render()}function removeLog(id){d.logs=d.logs.filter(x=>x.id!==id);save();render()}
function vision(){return `<div class="panel"><h2>Goal Vision — Photo Studio</h2><p class="muted">Upload a full-body photo to keep a private visual reference as you work toward your goal.</p><label for="bodyPhoto">Choose your current photo</label><input id="bodyPhoto" type="file" accept="image/png,image/jpeg,image/webp" onchange="previewPhoto(this)"><div id="photoPreview" style="margin:18px 0">${d.photo?`<img class="photo" alt="Your selected current photo" src="${d.photo}">`:'<p class="notice">No photo selected yet.</p>'}</div><button onclick="removePhoto()">Remove photo</button><h3 style="margin-top:25px">Future feature: AI goal visualization</h3><p class="notice">AI transformation images are <strong>not available in this version</strong>. Generating a simulated goal image requires an image-generation service and secure backend. A generated image would be an artistic visualization, not a scientifically reliable prediction of your future appearance. We will not upload your photo to a server without a clear consent step.</p><p class="muted">Your photo is saved only in this browser's local storage when possible. Anyone using this browser profile may see it. Do not upload photos of other people without permission.</p></div>`}function previewPhoto(inp){let file=inp.files?.[0];if(!file)return;if(!['image/jpeg','image/png','image/webp'].includes(file.type))return alert('Use a JPG, PNG or WebP photo.');if(file.size>8e6)return alert('Choose a photo under 8 MB.');let image=new Image();let url=URL.createObjectURL(file);image.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,750/image.width,900/image.height);c.width=Math.round(image.width*scale);c.height=Math.round(image.height*scale);c.getContext('2d').drawImage(image,0,0,c.width,c.height);d.photo=c.toDataURL('image/jpeg',0.72);URL.revokeObjectURL(url);save();render()};image.onerror=()=>{URL.revokeObjectURL(url);alert('Unable to read this photo.')};image.src=url}function removePhoto(){d.photo=null;save();render()}
function render(){let views={dashboard,profile,plan:workouts,meals,groceries,tv,progress,vision};$('view').innerHTML=views[page]()}nav('dashboard');
</script></body></html>
